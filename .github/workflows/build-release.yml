name: Build and Release

# Se déclenche automatiquement dès qu'un tag "vX.Y.Z" est envoyé sur GitHub
# (via le script publier_nouvelle_version.bat en un clic). GitHub crée la
# Release lui-même et y attache le .exe compilé. Aucune action manuelle
# sur le site GitHub n'est nécessaire.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

permissions:
    contents: write

jobs:
  build-windows-exe:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: badringo

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Compiler l'exécutable
        run: |
          pyinstaller --noconfirm --onefile --windowed --name BadringoForEnglish main.py

      - name: Créer la Release et attacher le .exe
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: badringo/dist/BadringoForEnglish.exe
